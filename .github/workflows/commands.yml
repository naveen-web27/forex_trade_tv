name: 💬 Telegram Commands

on:
  schedule:
    # Every 5 minutes during market hours
    - cron: "*/5 6-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: commands
  cancel-in-progress: false

jobs:
  cmds:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll & respond
        env:
          PYTHONPATH: bot
        run: python bot/run_commands.py

