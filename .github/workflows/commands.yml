name: 💬 Telegram Commands

on:
  schedule:
    # Every 5 minutes during market hours
    - cron: "*/5 6-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commands
  cancel-in-progress: false

jobs:
  cmds:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll & respond
        env:
          PYTHONPATH: bot
        run: python bot/run_commands.py

      - name: Commit cmd offset
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain bot/state)" ]]; then
            git add bot/state
            git commit -m "chore: cmd offset [skip ci]"
            git push
          fi
