name: 🧪 Test Telegram

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Check bot identity (getMe)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "bot")
          from src.config import TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
          import requests
          print(f"Token length: {len(TELEGRAM_BOT_TOKEN)}  Chat ID: {TELEGRAM_CHAT_ID}")
          r = requests.get(f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getMe", timeout=15)
          print("Status:", r.status_code, "Body:", r.text[:400])
          if r.status_code != 200:
              print("❌ Bot token INVALID. Open @BotFather → /token → update bot/src/config.py")
              sys.exit(1)
          print("✅ Bot:", r.json()["result"].get("username"))
          PY

      - name: Send test message
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "bot")
          from src.telegram_notify import send
          ok = send("✅ <b>Bot is live!</b>\n\nGitHub Actions can post to this group. Signal scanner ready. 🚀")
          print("Sent:", ok)
          if not ok:
              print("❌ Failed. Check: bot is added to group AND is admin.")
              sys.exit(1)
          PY
