name: 🔬 Weekly Backtest

on:
  schedule:
    # Sunday 8 PM IST = 14:30 UTC
    - cron: "30 14 * * 0"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate
      - name: Run backtest
        env:
          PYTHONPATH: bot
        run: python bot/run_backtest.py

