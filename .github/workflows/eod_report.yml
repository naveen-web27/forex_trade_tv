name: 🏁 EOD Report

on:
  schedule:
    # 11:00 PM IST Mon–Fri = 17:30 UTC
    - cron: "30 17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: eod
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate
      - name: Run EOD report
        env:
          PYTHONPATH: bot
        run: python bot/run_eod_report.py

