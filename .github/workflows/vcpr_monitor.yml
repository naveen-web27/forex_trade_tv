name: ⚡ VCPR Proximity Monitor

on:
  schedule:
    - cron: "*/15 * * * 1-5"   # every 15 min, Mon–Fri
  workflow_dispatch:             # allow manual run from Actions tab

concurrency:
  group: vcpr-monitor
  cancel-in-progress: false      # never drop a running check mid-flight

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VCPR proximity monitor
        env:
          PYTHONPATH: bot
          VCPR_SHEETS_WEBHOOK_URL: ${{ secrets.VCPR_SHEETS_WEBHOOK_URL }}
        run: python bot/run_vcpr_monitor.py

