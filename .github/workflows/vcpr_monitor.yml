name: ⚡ VCPR Proximity Monitor

on:
  schedule:
    - cron: "*/15 * * * 1-5"   # every 15 min, Mon–Fri
  workflow_dispatch:             # allow manual run from Actions tab

permissions:
  contents: write                # needed to commit vcpr_proximity_seen.json

concurrency:
  group: vcpr-monitor
  cancel-in-progress: false      # never drop a running check mid-flight

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VCPR proximity monitor
        env:
          PYTHONPATH: bot
        run: python bot/run_vcpr_monitor.py

      - name: Commit proximity dedup state (if changed)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain bot/state)" ]]; then
            git add bot/state
            git commit -m "chore: update vcpr proximity state [skip ci]"
            git push
          else
            echo "No state changes."
          fi
