name: 📈 Signal Scanner

on:
  schedule:
    # Every 15 minutes between 07:00–17:00 UTC (12:30–22:30 IST) Mon–Fri
    # GitHub cron is UTC; market hours = London + NY
    - cron: "*/15 7-17 * * 1-5"
  workflow_dispatch:   # allow manual run from Actions tab

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal scanner
        env:
          PYTHONPATH: bot
        run: python bot/run_signals.py
