name: 📈 Signal Scanner

on:
  schedule:
    # Every 15 minutes between 07:00–17:00 UTC (12:30–22:30 IST) Mon–Fri
    # GitHub cron is UTC; market hours = London + NY
    - cron: "*/15 7-17 * * 1-5"
  workflow_dispatch:   # allow manual run from Actions tab

permissions:
  contents: write      # needed to commit state file

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONPATH: bot
        run: python bot/run_signals.py

      - name: Commit dedupe state (if changed)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain bot/state)" ]]; then
            git add bot/state
            git commit -m "chore: update signal state [skip ci]"
            git push
          else
            echo "No state changes."
          fi
