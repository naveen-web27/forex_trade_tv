name: 📰 News Watcher

on:
  schedule:
    # Every 30 min between 06:00–22:00 UTC (~11:30 IST to 03:30 IST next day)
    - cron: "*/30 6-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run news watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: bot
        run: python bot/run_news_watcher.py

      - name: Commit news state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain bot/state)" ]]; then
            git add bot/state
            git commit -m "chore: update news state [skip ci]"
            git push
          else
            echo "No state changes."
          fi
