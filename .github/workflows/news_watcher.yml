name: 📰 News Watcher

on:
  schedule:
    # Every 30 min between 06:00–22:00 UTC (~11:30 IST to 03:30 IST next day)
    - cron: "*/30 6-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run news watcher
        env:
          PYTHONPATH: bot
        run: python bot/run_news_watcher.py

