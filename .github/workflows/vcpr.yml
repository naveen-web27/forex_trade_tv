name: 📈 VCPR Scanner

on:
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:   # allow manual run from Actions tab

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal scanner
        env:
          PYTHONPATH: bot
          VCPR_SHEETS_WEBHOOK_URL: ${{ secrets.VCPR_SHEETS_WEBHOOK_URL }}
        run: python bot/run_vcpr.py
